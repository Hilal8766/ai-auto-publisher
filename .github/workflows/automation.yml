import os
import re
import math
import asyncio
import subprocess
from pathlib import Path

from PIL import Image, ImageDraw, ImageFont

try:
    import edge_tts
except ImportError:
    edge_tts = None


# =========================================================
# FOLDERS
# =========================================================

OUTPUT_DIR = Path("output")
SCENE_DIR = OUTPUT_DIR / "scenes"
CLIP_DIR = OUTPUT_DIR / "clips"

OUTPUT_DIR.mkdir(parents=True, exist_ok=True)
SCENE_DIR.mkdir(parents=True, exist_ok=True)
CLIP_DIR.mkdir(parents=True, exist_ok=True)


# =========================================================
# RESOLUTION
# =========================================================

def get_resolution():
    value = os.getenv("VIDEO_RESOLUTION", "1080p").lower()

    if value == "8k":
        return 7680, 4320

    if value == "4k":
        return 3840, 2160

    return 1920, 1080


# =========================================================
# FONT
# =========================================================

def get_font(size):
    fonts = [
        "/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf",
        "/usr/share/fonts/truetype/liberation2/LiberationSans-Bold.ttf",
    ]

    for font_path in fonts:
        if Path(font_path).exists():
            return ImageFont.truetype(font_path, size)

    return ImageFont.load_default()


# =========================================================
# HINDI VOICE
# =========================================================

def create_voice(text, output_file="output/voice.mp3"):

    if not text:
        return {
            "status": "error",
            "message": "Script is empty."
        }

    if edge_tts is None:
        return {
            "status": "error",
            "message": "edge-tts is not installed."
        }

    output_path = Path(output_file)
    output_path.parent.mkdir(parents=True, exist_ok=True)

    async def generate():

        communicator = edge_tts.Communicate(
            text=text,
            voice="hi-IN-SwaraNeural",
            rate="+0%",
            pitch="+0Hz"
        )

        await communicator.save(str(output_path))

    try:

        asyncio.run(generate())

        return {
            "status": "success",
            "file": str(output_path)
        }

    except Exception as error:

        return {
            "status": "error",
            "message": str(error)
        }


# =========================================================
# STORY SPLITTER
# =========================================================

def split_story(script, maximum=30):

    text = re.sub(r"\s+", " ", script).strip()

    if not text:
        return []

    parts = re.split(
        r"(?<=[।.!?])\s+",
        text
    )

    parts = [
        part.strip()
        for part in parts
        if len(part.strip()) > 10
    ]

    if not parts:
        return [text]

    if len(parts) <= maximum:
        return parts

    group_size = max(
        1,
        math.ceil(len(parts) / maximum)
    )

    scenes = []

    for i in range(
        0,
        len(parts),
        group_size
    ):

        chunk = " ".join(
            parts[i:i + group_size]
        )

        if chunk:
            scenes.append(chunk)

        if len(scenes) >= maximum:
            break

    return scenes


# =========================================================
# DETECT SCENE
# =========================================================

def detect_scene(text):

    t = text.lower()

    if any(word in t for word in [
        "जंगल", "वन", "शेर", "भालू",
        "हाथी", "जानवर", "पेड़"
    ]):
        return "forest"

    if any(word in t for word in [
        "गांव", "गाँव", "किसान",
        "खेत", "गरीब", "घर",
        "मां", "माँ", "पिता"
    ]):
        return "village"

    if any(word in t for word in [
        "शहर", "बाजार", "सड़क",
        "कार", "बस", "दुकान"
    ]):
        return "city"

    if any(word in t for word in [
        "स्कूल", "पढ़ाई", "किताब",
        "अध्यापक", "मास्टर", "छात्र"
    ]):
        return "school"

    if any(word in t for word in [
        "राजा", "रानी", "महल",
        "राजकुमार", "राजकुमारी"
    ]):
        return "palace"

    if any(word in t for word in [
        "नदी", "तालाब", "समुद्र",
        "बारिश", "नाव"
    ]):
        return "water"

    if any(word in t for word in [
        "पहाड़", "पर्वत", "यात्रा",
        "सफर"
    ]):
        return "mountain"

    if any(word in t for word in [
        "रात", "अंधेरा", "भूत",
        "डर", "रहस्य", "सुनसान"
    ]):
        return "night"

    return "village"


# =========================================================
# BACKGROUND
# =========================================================

def draw_background(draw, width, height, scene):

    sky_colors = {
        "forest": (105, 185, 230),
        "village": (120, 195, 240),
        "city": (105, 175, 225),
        "school": (120, 195, 240),
        "palace": (145, 190, 235),
        "water": (100, 190, 235),
        "mountain": (120, 190, 235),
        "night": (25, 35, 75),
    }

    ground_colors = {
        "forest": (55, 135, 65),
        "village": (115, 165, 75),
        "city": (75, 80, 90),
        "school": (100, 160, 80),
        "palace": (120, 155, 80),
        "water": (40, 135, 180),
        "mountain": (80, 130, 90),
        "night": (35, 45, 55),
    }

    sky = sky_colors.get(
        scene,
        (120, 195, 240)
    )

    ground = ground_colors.get(
        scene,
        (110, 160, 70)
    )

    draw.rectangle(
        [0, 0, width, height],
        fill=sky
    )

    # Sun / moon

    if scene == "night":
        draw.ellipse(
            [
                int(width * 0.78),
                int(height * 0.08),
                int(width * 0.87),
                int(height * 0.17)
            ],
            fill=(245, 245, 205)
        )
    else:
        draw.ellipse(
            [
                int(width * 0.78),
                int(height * 0.08),
                int(width * 0.87),
                int(height * 0.17)
            ],
            fill=(255, 220, 80)
        )

    # Mountains

    if scene in [
        "mountain",
        "village",
        "water",
        "forest"
    ]:

        points = [
            (0, int(height * 0.63)),
            (int(width * 0.16), int(height * 0.38)),
            (int(width * 0.30), int(height * 0.62)),
            (int(width * 0.47), int(height * 0.30)),
            (int(width * 0.65), int(height * 0.62)),
            (int(width * 0.83), int(height * 0.40)),
            (width, int(height * 0.63)),
        ]

        draw.polygon(
            points,
            fill=(90, 120, 130)
        )

    # Ground

    draw.rectangle(
        [
            0,
            int(height * 0.62),
            width,
            height
        ],
        fill=ground
    )


# =========================================================
# TREE
# =========================================================

def draw_tree(draw, x, y, scale=1.0):

    trunk_width = int(45 * scale)
    trunk_height = int(160 * scale)

    draw.rectangle(
        [
            x,
            y,
            x + trunk_width,
            y + trunk_height
        ],
        fill=(105, 65, 35)
    )

    leaves = [
        (0, 0, 95),
        (65, -35, 82),
        (-55, -25, 78),
        (30, -90, 72),
    ]

    for dx, dy, radius in leaves:

        draw.ellipse(
            [
                int(x + dx - radius),
                int(y + dy - radius),
                int(x + dx + radius),
                int(y + dy + radius)
            ],
            fill=(45, 140, 65)
        )


# =========================================================
# HOUSE
# =========================================================

def draw_house(draw, width, height):

    x = int(width * 0.10)
    y = int(height * 0.40)

    w = int(width * 0.32)
    h = int(height * 0.27)

    draw.rectangle(
        [
            x,
            y,
            x + w,
            y + h
        ],
        fill=(230, 175, 110)
    )

    draw.polygon(
        [
            (x - 35, y),
            (x + w // 2, int(y - h * 0.55)),
            (x + w + 35, y)
        ],
        fill=(150, 65, 45)
    )

    draw.rectangle(
        [
            x + int(w * 0.42),
            y + int(h * 0.48),
            x + int(w * 0.62),
            y + h
        ],
        fill=(90, 60, 45)
    )


# =========================================================
# CITY
# =========================================================

def draw_city(draw, width, height):

    for i in range(9):

        x = int(
            width * (0.02 + i * 0.11)
        )

        building_height = int(
            height * (
                0.18 +
                (i % 4) * 0.08
            )
        )

        draw.rectangle(
            [
                x,
                int(height * 0.62) - building_height,
                x + int(width * 0.08),
                int(height * 0.62)
            ],
            fill=(70, 75, 100)
        )


# =========================================================
# SCHOOL
# =========================================================

def draw_school(draw, width, height):

    left = int(width * 0.10)
    top = int(height * 0.35)
    right = int(width * 0.52)
    bottom = int(height * 0.64)

    draw.rectangle(
        [
            left,
            top,
            right,
            bottom
        ],
        fill=(235, 190, 90)
    )

    draw.polygon(
        [
            (int(width * 0.06), top),
            (int(width * 0.31), int(height * 0.18)),
            (int(width * 0.56), top)
        ],
        fill=(150, 70, 50)
    )

    for i in range(3):

        x = int(
            width * (0.16 + i * 0.10)
        )

        draw.rectangle(
            [
                x,
                int(height * 0.43),
                x + int(width * 0.055),
                int(height * 0.54)
            ],
            fill=(90, 160, 210)
        )


# =========================================================
# PALACE
# =========================================================

def draw_palace(draw, width, height):

    left = int(width * 0.18)
    top = int(height * 0.25)
    right = int(width * 0.72)
    bottom = int(height * 0.65)

    draw.rectangle(
        [
            left,
            top,
            right,
            bottom
        ],
        fill=(225, 190, 110)
    )

    for x_ratio in [0.25, 0.43, 0.61]:

        x = int(width * x_ratio)

        draw.rectangle(
            [
                x,
                int(height * 0.10),
                x + int(width * 0.07),
                bottom
            ],
            fill=(205, 170, 90)
        )


# =========================================================
# CHARACTER
# =========================================================

def draw_character(
    draw,
    width,
    height,
    side=0,
    emotion="happy"
):

    if side == 0:
        cx = int(width * 0.62)
    else:
        cx = int(width * 0.78)

    cy = int(height * 0.50)

    # Head

    draw.ellipse(
        [
            cx - 75,
            cy - 185,
            cx + 75,
            cy - 35
        ],
        fill=(245, 190, 145)
    )

    # Hair

    draw.ellipse(
        [
            cx - 82,
            cy - 210,
            cx + 82,
            cy - 95
        ],
        fill=(55, 35, 25)
    )

    # Eyes

    draw.ellipse(
        [
            cx - 34,
            cy - 130,
            cx - 12,
            cy - 104
        ],
        fill=(20, 20, 20)
    )

    draw.ellipse(
        [
            cx + 12,
            cy - 130,
            cx + 34,
            cy - 104
        ],
        fill=(20, 20, 20)
    )

    # Body

    if side == 0:
        shirt = (65, 110, 195)
    else:
        shirt = (190, 75, 85)

    draw.rounded_rectangle(
        [
            cx - 90,
            cy - 35,
            cx + 90,
            cy + 200
        ],
        radius=40,
        fill=shirt
    )

    # Arms

    draw.line(
        [
            cx - 65,
            cy + 5,
            cx - 150,
            cy + 105
        ],
        fill=shirt,
        width=35
    )

    draw.line(
        [
            cx + 65,
            cy + 5,
            cx + 150,
            cy + 105
        ],
        fill=shirt,
        width=35
    )

    # Legs

    draw.line(
        [
            cx - 35,
            cy + 190,
            cx - 65,
            cy + 340
        ],
        fill=(45, 45, 65),
        width=45
    )

    draw.line(
        [
            cx + 35,
            cy + 190,
            cx + 65,
            cy + 340
        ],
        fill=(45, 45, 65),
        width=45
    )

    # Mouth

    if emotion == "sad":

        draw.arc(
            [
                cx - 30,
                cy - 75,
                cx + 30,
                cy - 25
            ],
            200,
            340,
            fill=(90, 20, 20),
            width=8
        )

    else:

        draw.arc(
            [
                cx - 30,
                cy - 75,
                cx + 30,
                cy - 25
            ],
            20,
            160,
            fill=(90, 20, 20),
            width=8
        )


# =========================================================
# CARTOON SCENE
# =========================================================

def create_cartoon_scene(
    text,
    index,
    total,
    width,
    height
):

    image = Image.new(
        "RGB",
        (width, height),
        (120, 195, 240)
    )

    draw = ImageDraw.Draw(image)

    scene = detect_scene(text)

    draw_background(
        draw,
        width,
        height,
        scene
    )

    # Scene objects

    if scene in [
        "forest",
        "village"
    ]:

        draw_tree(
            draw,
            int(width * 0.08),
            int(height * 0.43),
            1.0
        )

        draw_tree(
            draw,
            int(width * 0.83),
            int(height * 0.42),
            0.9
        )

    if scene == "village":

        draw_house(
            draw,
            width,
            height
        )

    elif scene == "city":

        draw_city(
            draw,
            width,
            height
        )

    elif scene == "school":

        draw_school(
            draw,
            width,
            height
        )

    elif scene == "palace":

        draw_palace(
            draw,
            width,
            height
        )

    # Characters

    draw_character(
        draw,
        width,
        height,
        side=0,
        emotion="happy"
    )

    draw_character(
        draw,
        width,
        height,
        side=1,
        emotion="happy"
    )

    # Scene number

    font = get_font(
        max(24, int(width * 0.018))
    )

    label = f"Scene {index + 1}/{total}"

    draw.rounded_rectangle(
        [
            30,
            30,
            30 + int(width * 0.16),
            30 + int(height * 0.055)
        ],
        radius=15,
        fill=(0, 0, 0)
    )

    draw.text(
        [
            45,
            38
        ],
        label,
        font=font,
        fill=(255, 255, 255)
    )

    # Cinematic black bars

    bar_height = int(height * 0.055)

    draw.rectangle(
        [
            0,
            0,
            width,
            bar_height
        ],
        fill=(0, 0, 0)
    )

    draw.rectangle(
        [
            0,
            height - bar_height,
            width,
            height
        ],
        fill=(0, 0, 0)
    )

    output_file = (
        SCENE_DIR /
        f"scene_{index + 1:03d}.jpg"
    )

    image.save(
        output_file,
        quality=94,
        optimize=True
    )

    return str(output_file)


# =========================================================
# AUDIO DURATION
# =========================================================

def get_audio_duration(audio_file):

    command = [
        "ffprobe",
        "-v",
        "error",
        "-show_entries",
        "format=duration",
        "-of",
        "default=noprint_wrappers=1:nokey=1",
        str(audio_file)
    ]

    try:

        result = subprocess.run(
            command,
            capture_output=True,
            text=True,
            check=True
        )

        return float(
            result.stdout.strip()
        )

    except Exception:

        return 10.0


# =========================================================
# ANIMATED VIDEO
# =========================================================

def make_cinematic_video(
    scene_files,
    audio_file,
    output_file,
    width,
    height
):

    if not scene_files:

        return {
            "status": "error",
            "message": "No cartoon scenes found."
        }

    Path(output_file).parent.mkdir(
        parents=True,
        exist_ok=True
    )

    total_duration = get_audio_duration(
        audio_file
    )

    # Keep a minimum of 6 seconds per scene
    scene_count = max(
        len(scene_files),
        math.ceil(
            total_duration / 6.0
        )
    )

    selected_scenes = []

    for i in range(scene_count):

        selected_scenes.append(
            scene_files[
                i % len(scene_files)
            ]
        )

    scene_duration = (
        total_duration /
        len(selected_scenes)
    )

    clip_files = []

    # Remove old clips

    for old_clip in CLIP_DIR.glob(
        "scene_*.mp4"
    ):

        try:
            old_clip.unlink()
        except Exception:
            pass

    # Create animated clips

    for index, scene_file in enumerate(
        selected_scenes
    ):

        clip_file = (
            CLIP_DIR /
            f"scene_{index + 1:03d}.mp4"
        )

        frames = max(
            1,
            int(scene_duration * 30)
        )

        fade = min(
            0.6,
            scene_duration / 4
        )

        # Different camera movement
        # for different scenes.

        mode = index % 4

        if mode == 0:

            zoom = (
                "min(zoom+0.0012,1.15)"
            )

            x = (
                "iw/2-(iw/zoom/2)"
            )

            y = (
                "ih/2-(ih/zoom/2)"
            )

        elif mode == 1:

            zoom = (
                "min(zoom+0.0010,1.12)"
            )

            x = (
                "(iw-iw/zoom)*on/"
                f"{frames}"
            )

            y = (
                "ih/2-(ih/zoom/2)"
            )

        elif mode == 2:

            zoom = (
                "max(zoom-0.0007,1.0)"
            )

            x = (
                "(iw-iw/zoom)*"
                f"(1-on/{frames})"
            )

            y = (
                "ih/2-(ih/zoom/2)"
            )

        else:

            zoom = (
                "min(zoom+0.0009,1.13)"
            )

            x = (
                "iw/2-(iw/zoom/2)"
            )

            y = (
                "(ih-ih/zoom)*on/"
                f"{frames}"
            )

        filter_complex = (
            f"scale={width}:{height}:"
            "force_original_aspect_ratio=increase,"
            f"crop={width}:{height},"
            "zoompan="
            f"z='{zoom}':"
            f"x='{x}':"
            f"y='{y}':"
            f"d={frames}:"
            f"s={width}x{height}:"
            "fps=30,"
            f"fade=t=in:st=0:d={fade},"
            f"fade=t=out:"
            f"st={max(0, scene_duration - fade)}:"
            f"d={fade}"
        )

        command = [
            "ffmpeg",
            "-y",
            "-loop",
            "1",
            "-i",
            str(scene_file),
            "-t",
            str(scene_duration),
            "-vf",
            filter_complex,
            "-an",
            "-c:v",
            "libx264",
            "-preset",
            "veryfast",
            "-crf",
            "22",
            "-pix_fmt",
            "yuv420p",
            str(clip_file)
        ]

        try:

            subprocess.run(
                command,
                check=True,
                stdout=subprocess.DEVNULL,
                stderr=subprocess.PIPE
            )

            clip_files.append(
                str(clip_file)
            )

        except subprocess.CalledProcessError as error:

            return {
                "status": "error",
                "message": "Animated scene creation failed.",
                "scene": index + 1,
                "error": error.stderr.decode(
                    "utf-8",
                    errors="ignore"
                )[-3000:]
            }

    # Concatenate

    concat_file = (
        CLIP_DIR /
        "concat.txt"
    )

    with open(
        concat_file,
        "w",
        encoding="utf-8"
    ) as file:

        for clip in clip_files:

            absolute = Path(
                clip
            ).resolve()

            file.write(
                f"file '{absolute}'\n"
            )

    silent_video = (
        CLIP_DIR /
        "silent_video.mp4"
    )

    concat_command = [
        "ffmpeg",
        "-y",
        "-f",
        "concat",
        "-safe",
        "0",
        "-i",
        str(concat_file),
        "-c",
        "copy",
        str(silent_video)
    ]

    try:

        subprocess.run(
            concat_command,
            check=True,
            stdout=subprocess.DEVNULL,
            stderr=subprocess.PIPE
        )

    except subprocess.CalledProcessError as error:

        return {
            "status": "error",
            "message": "Could not join cartoon scenes.",
            "error": error.stderr.decode(
                "utf-8",
                errors="ignore"
            )[-3000:]
        }

    # Add Hindi narration

    final_command = [
        "ffmpeg",
        "-y",
        "-i",
        str(silent_video),
        "-i",
        str(audio_file),
        "-map",
        "0:v:0",
        "-map",
        "1:a:0",
        "-c:v",
        "libx264",
        "-preset",
        "veryfast",
        "-crf",
        "22",
        "-c:a",
        "aac",
        "-b:a",
        "192k",
        "-shortest",
        "-movflags",
        "+faststart",
        str(output_file)
    ]

    try:

        subprocess.run(
            final_command,
            check=True,
            stdout=subprocess.DEVNULL,
            stderr=subprocess.PIPE
        )

    except subprocess.CalledProcessError as error:

        return {
            "status": "error",
            "message": "Could not add Hindi voice.",
            "error": error.stderr.decode(
                "utf-8",
                errors="ignore"
            )[-3000:]
        }

    return {
        "status": "success",
        "file": str(output_file),
        "duration": round(
            total_duration,
            2
        ),
        "scenes": len(
            selected_scenes
        ),
        "resolution": (
            f"{width}x{height}"
        ),
        "animation": "cartoon_camera_motion"
    }


# =========================================================
# THUMBNAIL
# =========================================================

def create_thumbnail(
    title,
    output_file="output/thumbnail.jpg"
):

    width = 1280
    height = 720

    image = Image.new(
        "RGB",
        (width, height),
        (35, 70, 110)
    )

    draw = ImageDraw.Draw(image)

    # Background

    draw.rectangle(
        [
            0,
            0,
            width,
            height
        ],
        fill=(55, 105, 150)
    )

    # Simple cartoon characters

    draw_character(
        draw,
        width,
        height,
        side=0,
        emotion="happy"
    )

    draw_character(
        draw,
        width,
        height,
        side=1,
        emotion="sad"
    )

    # Title

    title = str(title or "Hindi Kahani")

    if len(title) > 55:
        title = title[:55] + "..."

    font = get_font(58)

    text_box = draw.textbbox(
        (0, 0),
        title,
        font=font
    )

    text_width = (
        text_box[2] -
        text_box[0]
    )

    x = max(
        30,
        (width - text_width) // 2
    )

    y = 45

    draw.rounded_rectangle(
        [
            x - 25,
            y - 15,
            x + text_width + 25,
            y + 80
        ],
        radius=20,
        fill=(0, 0, 0)
    )

    draw.text(
        [
            x,
            y
        ],
        title,
        font=font,
        fill=(255, 255, 255)
    )

    output_path = Path(
        output_file
    )

    output_path.parent.mkdir(
        parents=True,
        exist_ok=True
    )

    image.save(
        output_path,
        quality=95
    )

    return {
        "status": "success",
        "file": str(output_path)
    }


# =========================================================
# MAIN MEDIA PREPARATION
# =========================================================

def prepare_media(
    script,
    title="Hindi Cartoon Story"
):

    width, height = get_resolution()

    # -----------------------------------------------------
    # 1. Hindi Voice
    # -----------------------------------------------------

    voice = create_voice(
        script,
        "output/voice.mp3"
    )

    if voice.get("status") != "success":

        return {
            "status": "error",
            "voice": voice
        }

    # -----------------------------------------------------
    # 2. Split Story
    # -----------------------------------------------------

    story_parts = split_story(
        script,
        maximum=30
    )

    if not story_parts:

        story_parts = [
            "आज की कहानी शुरू होती है।",
            "इस कहानी में एक खास घटना होने वाली थी।"
        ]

    # -----------------------------------------------------
    # 3. Create Cartoon Scenes
    # -----------------------------------------------------

    scene_files = []

    for index, part in enumerate(
        story_parts
    ):

        scene = create_cartoon_scene(
            part,
            index,
            len(story_parts),
            width,
            height
        )

        scene_files.append(
            scene
        )

    # -----------------------------------------------------
    # 4. Create Animated Video
    # -----------------------------------------------------

    video = make_cinematic_video(
        scene_files,
        "output/voice.mp3",
        "output/video.mp4",
        width,
        height
    )

    if video.get("status") != "success":

        return {
            "status": "error",
            "voice": voice,
            "video": video
        }

    # -----------------------------------------------------
    # 5. Thumbnail
    # -----------------------------------------------------

    thumbnail = create_thumbnail(
        title,
        "output/thumbnail.jpg"
    )

    # -----------------------------------------------------
    # Final Result
    # -----------------------------------------------------

    return {
        "status": "success",

        "voice": voice,

        "visual": {
            "status": "success",
            "type": "cartoon",
            "scenes": len(scene_files),
            "resolution": (
                f"{width}x{height}"
            )
        },

        "video": video,

        "thumbnail": thumbnail
    }
